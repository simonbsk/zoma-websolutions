<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ZomaWebsolutions — premium websites designed and engineered for growing businesses." />
    <meta name="theme-color" content="#fbfaf7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Source+Serif+4:opsz,wght@8..60,400&family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..500,100,0&family=DM+Sans:opsz,wght@9..40,400..600&display=swap"
      rel="stylesheet"
    />
    <title>ZomaWebsolutions — Premium Web Design</title>
    <!-- Apply the visitor's chosen design before first paint (classic on a first visit). -->
    <script>
      try {
        var d = localStorage.getItem('zoma:design');
        document.documentElement.dataset.design = d === 'sky' ? 'sky' : 'classic';
      } catch (e) {
        document.documentElement.dataset.design = 'classic';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
