<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ZomaWebsolutions — custom websites for small businesses. Fixed prices, no templates, an answer within 3 working days."
    />
    <meta name="theme-color" content="#fdfcf9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Space Grotesk + Space Mono for the site, Inter for the dashboard; Unbounded, Bebas Neue and
         Fraunces only appear inside the three concept websites. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono&family=Inter:wght@400;450;500;600;700&family=Unbounded:wght@600;700&family=Bebas+Neue&family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <title>ZomaWebsolutions — Custom Websites</title>
    <!-- The public site's background (bone white or #181818), set before first paint. The dashboard has its own look. -->
    <script>
      try {
        if (!location.pathname.startsWith('/admin')) {
          var t = localStorage.getItem('zoma:theme') === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#181818');
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
